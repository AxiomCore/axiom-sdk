name: axiom_flutter
description: "Flutter client runtime for AxiomCore contracts: typed queries, mutations, streams, caching, auth and cancellation on Android, iOS, macOS and web."
version: 0.150.1
homepage: https://github.com/AxiomCore/axiom-sdk
repository: https://github.com/AxiomCore/axiom-sdk
issue_tracker: https://github.com/AxiomCore/axiom-sdk/issues
documentation: https://docs.axiomcore.dev
topics:
  - api
  - network
  - http
  - ffi
  - codegen

# Platforms listed on pub.dev. Web runs the bundled wasm runtime through a
# conditional import, so it needs no plugin registration.
platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4
  path_provider: ^2.1.5
  ansicolor: ^2.0.3
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        pluginClass: AxiomFlutterPlugin
      macos:
        pluginClass: AxiomFlutterPlugin

  # Web runtime (wasm + JS glue). Flutter 3.32 has no per-platform assets;
  # android/build.gradle removes them from Android builds, iOS/macOS carry
  # them unless the app opts out: see doc/wasm-size.md.
  assets:
    - lib/assets/wasm/axiom_runtime.js
    - lib/assets/wasm/axiom_runtime_bg.wasm
