// Android module of axiom_flutter (ffiPlugin: true, no Java/Kotlin code).
// It only ships the prebuilt runtime libraries from src/main/jniLibs/<abi>/.
// See README.md in this directory for how they are produced and updated.
group = "dev.axiomcore.axiom_flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "dev.axiomcore.axiom_flutter"
    compileSdk = 35

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    packagingOptions {
        jniLibs {
            // Keep the .so uncompressed and page aligned in the APK so it is
            // mapped in place (16 KB page devices included).
            useLegacyPackaging = false
        }
    }
}

// The web runtime (lib/assets/wasm: axiom_runtime_bg.wasm + JS glue, ~0.96 MB
// compressed per APK) is a package asset because Flutter 3.32 has no
// per-platform assets, but Android never loads it (it uses
// libaxiom_runtime.so). Remove it from the app's merged Flutter assets after
// Flutter copies them. Keep it with `axiom.keepWebAssets=true` in the app's
// android/gradle.properties.
def axiomKeepWebAssets = (rootProject.findProperty("axiom.keepWebAssets") ?: "false").toString().toBoolean()
if (!axiomKeepWebAssets) {
    gradle.projectsEvaluated {
        rootProject.allprojects { p ->
            p.tasks.matching { it.name.startsWith("copyFlutterAssets") }.configureEach { t ->
                t.doLast {
                    t.outputs.files.each { out ->
                        p.fileTree(out) { include "**/packages/axiom_flutter/lib/assets/wasm/**" }
                            .each { it.delete() }
                    }
                }
            }
        }
    }
}
