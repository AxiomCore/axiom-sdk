name: axiom_flutter_generator
description: Generates a typed Dart client for axiom_flutter from an Axiom contract. Run by `axiom pull --framework flutter`.
version: 0.147.5
homepage: https://github.com/AxiomCore/axiom-sdk
repository: https://github.com/AxiomCore/axiom-sdk
issue_tracker: https://github.com/AxiomCore/axiom-sdk/issues
documentation: https://docs.axiomcore.dev
topics:
  - codegen
  - api
  - network

environment:
  sdk: ^3.8.0

# Add regular dependencies here.
dependencies:
  path: ^1.9.1
  yaml: ^3.1.3
  args: ^2.4.0
  toml: ^0.18.0
  collection: ^1.18.0
  crypto: ^3.0.6

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
