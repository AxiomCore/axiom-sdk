name: axiom_flutter_auth
description: "Managed Axiom project authentication for Flutter (auth-surfaces/v1 client): sign-in, refresh with rotation, secure session storage, PKCE redirects, MFA and step-up, wired into axiom_flutter."
version: 0.150.0
homepage: https://github.com/AxiomCore/axiom-sdk
repository: https://github.com/AxiomCore/axiom-sdk
issue_tracker: https://github.com/AxiomCore/axiom-sdk/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  axiom_flutter: ^0.150.0
  http: ^1.2.0
  crypto: ^3.0.3
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^4.1.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
