name: axiom_flutter_auth
description: "Managed Axiom project authentication for Flutter: sign-in, token refresh with rotation, secure session storage, PKCE redirects and MFA, wired into axiom_flutter."
version: 0.150.1
homepage: https://github.com/AxiomCore/axiom-sdk
repository: https://github.com/AxiomCore/axiom-sdk
issue_tracker: https://github.com/AxiomCore/axiom-sdk/issues
documentation: https://docs.axiomcore.dev/docs/sdks/flutter-auth
topics:
  - authentication
  - oauth
  - security
  - api

# Platforms listed on pub.dev (the platforms axiom_flutter supports).
platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ^3.8.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  axiom_flutter: ^0.150.1
  http: ^1.2.0
  crypto: ^3.0.3
  flutter_secure_storage: ^10.0.0
  flutter_web_auth_2: ^4.1.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
