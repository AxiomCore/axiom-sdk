name: axiom_flutter_extensions
description: "Full AxiomCore runtime with executable extensions for axiom_flutter on Android. Add it only if your contract uses executable extensions."
version: 0.150.1
homepage: https://github.com/AxiomCore/axiom-sdk
repository: https://github.com/AxiomCore/axiom-sdk
issue_tracker: https://github.com/AxiomCore/axiom-sdk/issues
documentation: https://docs.axiomcore.dev
topics:
  - api
  - ffi
  - codegen

environment:
  sdk: ^3.8.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  axiom_flutter: ^0.150.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# Android only: ships libaxiom_runtime_full.so in jniLibs/<abi>/ and removes
# axiom_flutter's lean libaxiom_runtime.so from the app (see android/build.gradle).
# iOS and macOS already use the full runtime; on web extensions do not exist.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
